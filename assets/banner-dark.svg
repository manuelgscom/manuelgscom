<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Manuel García Sanz · AI Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1b1740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect x="760" width="440" height="260" fill="url(#grid)" opacity="0.7"/>

  <!-- small network: input -> small model -> deterministic check -->
  <g stroke="#3d4a63" stroke-width="1.5" fill="none">
    <path d="M830 80 L930 130 L1030 95 L1120 140"/>
    <path d="M830 180 L930 130 L1030 175 L1120 140"/>
    <path d="M930 130 L1030 95 M930 130 L1030 175"/>
  </g>
  <g>
    <circle cx="830" cy="80" r="7" fill="#58a6ff"/>
    <circle cx="830" cy="180" r="7" fill="#58a6ff"/>
    <circle cx="930" cy="130" r="11" fill="#8b9cff"/>
    <circle cx="1030" cy="95" r="7" fill="#a48cff"/>
    <circle cx="1030" cy="175" r="7" fill="#a48cff"/>
    <circle cx="1120" cy="140" r="12" fill="none" stroke="#bc8cff" stroke-width="2"/>
    <path d="M1114 140 l5 5 l9 -10" stroke="#bc8cff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="98" font-size="46" font-weight="700" fill="#f0f6fc">Manuel García Sanz</text>
    <rect x="60" y="116" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="158" font-size="24" font-weight="600" fill="#c9d1d9">AI Architect · LLM platforms · On-prem &amp; hybrid AI</text>
    <text x="60" y="198" font-size="18" fill="#8b949e">Small specialized models that beat 10× larger generalists.</text>
    <text x="60" y="224" font-size="18" fill="#8b949e">Critical decisions made by deterministic code.</text>
  </g>
</svg>
