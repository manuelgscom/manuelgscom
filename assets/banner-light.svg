<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Manuel García Sanz · AI Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#ece8fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0d7de"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
  <rect x="760" width="440" height="260" fill="url(#grid)" opacity="0.7"/>

  <!-- small network: input -> small model -> deterministic check -->
  <g stroke="#b6c2d6" stroke-width="1.5" fill="none">
    <path d="M830 80 L930 130 L1030 95 L1120 140"/>
    <path d="M830 180 L930 130 L1030 175 L1120 140"/>
    <path d="M930 130 L1030 95 M930 130 L1030 175"/>
  </g>
  <g>
    <circle cx="830" cy="80" r="7" fill="#0969da"/>
    <circle cx="830" cy="180" r="7" fill="#0969da"/>
    <circle cx="930" cy="130" r="11" fill="#4f62d9"/>
    <circle cx="1030" cy="95" r="7" fill="#7a5af0"/>
    <circle cx="1030" cy="175" r="7" fill="#7a5af0"/>
    <circle cx="1120" cy="140" r="12" fill="none" stroke="#8250df" stroke-width="2"/>
    <path d="M1114 140 l5 5 l9 -10" stroke="#8250df" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="98" font-size="46" font-weight="700" fill="#1f2328">Manuel García Sanz</text>
    <rect x="60" y="116" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="158" font-size="24" font-weight="600" fill="#31363c">AI Architect · LLM platforms · On-prem &amp; hybrid AI</text>
    <text x="60" y="198" font-size="18" fill="#59636e">Small specialized models that beat 10× larger generalists.</text>
    <text x="60" y="224" font-size="18" fill="#59636e">Critical decisions made by deterministic code.</text>
  </g>
</svg>
